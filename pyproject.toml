[project]
name = "ai-text-assistant"
version = "0.1.0"
description = "A tiny, offline rule-based text-analysis service with a web UI."
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
